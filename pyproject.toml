[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "linkedin-bots"
version = "1.0.2"
description = "Selenium bots that drive your own logged-in Chrome to automate LinkedIn outreach: connection invitations, follow-up messages and withdrawing stale invitations."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Lucas Bueno Cesario" }]
requires-python = ">=3.10"
dependencies = [
    "selenium==4.33.0",
    "argcomplete>=3.0",
    "platformdirs>=4.0",
    "tzdata; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "import-linter>=2.1", "lxml>=5.0"]

[project.scripts]
linkedin-bots = "linkedin_bots.cli:main"

[project.urls]
Repository = "https://github.com/lucasbc92/linkedin-bots"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
linkedin_bots = ["*/templates/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.importlinter]
root_package = "linkedin_bots"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "The CLI composes the contexts; the contexts build on the shared kernel"
type = "layers"
layers = [
    "linkedin_bots.cli",
    "linkedin_bots.connecting | linkedin_bots.messaging | linkedin_bots.withdrawing",
    "linkedin_bots.shared",
]

[[tool.importlinter.contracts]]
name = "Bounded contexts are independent"
type = "independence"
modules = [
    "linkedin_bots.connecting",
    "linkedin_bots.messaging",
    "linkedin_bots.withdrawing",
]

[[tool.importlinter.contracts]]
name = "Hexagonal layers inside each context"
type = "layers"
containers = ["linkedin_bots.connecting", "linkedin_bots.messaging", "linkedin_bots.withdrawing"]
layers = ["adapters", "application", "domain"]

[[tool.importlinter.contracts]]
name = "Shared kernel: infrastructure builds on domain"
type = "layers"
containers = ["linkedin_bots.shared"]
layers = ["infrastructure", "domain"]

[[tool.importlinter.contracts]]
name = "Domain and application code never touch Selenium"
type = "forbidden"
source_modules = [
    "linkedin_bots.shared.domain",
    "linkedin_bots.connecting.domain",
    "linkedin_bots.connecting.application",
    "linkedin_bots.messaging.domain",
    "linkedin_bots.messaging.application",
    "linkedin_bots.withdrawing.domain",
    "linkedin_bots.withdrawing.application",
]
forbidden_modules = ["selenium"]

[[tool.importlinter.contracts]]
name = "Domain and application code stay off the shared infrastructure"
type = "forbidden"
source_modules = [
    "linkedin_bots.connecting.domain",
    "linkedin_bots.connecting.application",
    "linkedin_bots.messaging.domain",
    "linkedin_bots.messaging.application",
    "linkedin_bots.withdrawing.domain",
    "linkedin_bots.withdrawing.application",
]
forbidden_modules = ["linkedin_bots.shared.infrastructure"]
